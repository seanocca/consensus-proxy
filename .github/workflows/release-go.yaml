name: 'Release'

on:
  push:
    branches:
      - main

# Runs on every push to main; go-semantic-release reads conventional commits and creates a tag + GitHub release if warranted

jobs:
  release-go:
    name: 'Release Go Application'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Create Release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: 'CHANGELOG.md'